# nfpm configuration for building .deb packages.
# Install nfpm:  go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
# Build package: make deb   (or: nfpm pkg --packager deb --target dist/)
# Docs: https://nfpm.goreleaser.com/

name: deskwall
arch: amd64
platform: linux
version: 0.1.0
section: utils
priority: optional
maintainer: Juan Francisco Giménez Silva <juanfgs@gmail.com>
description: |
  Deskwall - a desktop wallpaper browser and applier.
  Search wallhaven.cc, preview, download, and apply wallpapers.
  Built with Go and Fyne.
vendor: deskwall
homepage: https://github.com/juanfgs/deskwall
license: GPL-3.0

# Fyne renders via GLFW + OpenGL; runtime needs GL and X11 userland.
depends:
  - libgl1
  - libegl1
  - libx11-6
  - libxrandr2
  - libxinerama1
  - libxcursor1
  - libxi6
  - libxxf86vm1

# Files to ship with the package.
contents:
  - src: dist/deskwall
    dst: /usr/bin/deskwall
  - src: assets/deskwall.desktop
    dst: /usr/share/applications/deskwall.desktop
  - src: assets/deskwall.svg
    dst: /usr/share/icons/hicolor/scalable/apps/deskwall.svg

# Scripts run during package lifecycle (optional).
# scripts:
#   postinstall: scripts/postinstall.sh
#   preremove: scripts/preremove.sh
